# The same three things `make test` runs, on every push to main and every pull request.
#
# Order matters: the dashboard is built before pytest. tests/test_static.py (the SPA fallback) skips
# itself when web/dist is missing, so a pytest-first pipeline would go green while testing nothing there.
#
# Keyless on purpose. No WANDB_API_KEY is set, so the suite exercises the paths a fresh clone hits:
# replay-only health, 503s on live routes, and ANTIBODY_NO_ZENDESK=1 keeps every test on the mock world.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTIBODY_NO_ZENDESK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build the dashboard
        run: npm --prefix web run build

      - name: Lint the dashboard
        run: npm --prefix web run lint

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run the tests
        run: uv run pytest -q
